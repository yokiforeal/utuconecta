<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrarse - ANEP UTU</title>
    <link rel="stylesheet" href="styles\style_register_pc.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
    </style>
</head>
<body>
    <div class="all-app">
        
        <div class = "rectangulo-azul"></div>
        
        <div class="contenido_medio">
            <div class="parte_izquierda ">
                <div>      
                    <img id="logoutu" src="img/logoutu.png" alt="Logo de Escuela Técnica">
                     
                    <form method="post" class="formulario-login">
                          <div class="nombre">
                            <input type="text" required placeholder="Nombre">
                        </div>
                        <div class="apellido">
                            <input type="text" required placeholder="Apellido">
                        </div>
                          <div class="cedula">
                            <input type="text" required placeholder="Cédula">
                        </div>
                        <div class="Teléfono">
                            <input type="text" required placeholder="Teléfono">
                        </div>
                        <div class="Email">
                            <input type="text" required placeholder="Email">
                        </div>
                        <div class="username">
                            <input type="text" required placeholder="Nombre de Usuario">
                        </div>
                        <div class="localidad">
                            <input type="text" required placeholder="Localidad">
                        </div>
                        <div class="Código Postal" id="codpostal">
                            <input type="text" required placeholder="Código Postal">
                        </div>
                        
                        
                        <input type="submit" value="Registrarse">
                        
                        
                    </form>

                </div>

               
            </div>
            
            <div class="parte_derecha">
                <div>
                    <img id="imagen_login" src="img/register.jpg" alt="Oficinista de Stock">
                </div>
            </div>        
        </div>
        <div id = "rectangulo-azul-abajo" class = "rectangulo-azul"></div>
    </div>    
</body>
